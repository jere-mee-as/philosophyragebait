<style>
/* Same look as the Philchat generator. Screen 1 "What are you into?" — philosophers, schools and ideas, grouped
   from the ancients to politics. Screen 2 — "Rage bait for… [Kant]" → the line in a book serif → Shuffle. */
:root{
  --bg:#ffffff; --ink:#18181a; --soft:#55555c; --muted:#8b8b93; --line:#e8e8ec; --hover:#f4f4f6; --hover-soft:#f9f9fa; --fill:#f6f6f8; --pop:#ffffff; --ring:#ececf0;
  --shadow:0 12px 32px -12px rgba(20,20,30,.22),0 0 0 1px rgba(20,20,30,.06);
  --rage:#e0412f;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --hover-soft:#121214; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --ink:#ececee; --soft:#b0b0b8; --muted:#76767e; --line:#222226; --hover:#17171a; --hover-soft:#121214; --fill:#131315; --pop:#141416; --ring:#202024;
  --shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06); --rage:#ff6a57; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.chip:active,.trigger:active,.list li:active,.textbtn:active,.icon:active,.mark:active{background:var(--hover-soft)}
.back:active{background:var(--fill)}
button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);transition:background-color .4s,color .4s;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:64px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column}
body:not(.on-gen) .wrap{max-width:860px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:52px}
.mark{font-size:14px;color:var(--muted);letter-spacing:.01em;text-decoration:none;border-radius:6px;transition:opacity .2s;white-space:nowrap;-webkit-touch-callout:none}
.mark:hover{opacity:.7}
.mark:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.mark b{font-weight:500;color:var(--ink)}
.mark .gen{opacity:.6}
body.on-gen header{margin-bottom:22px}
body.on-gen .mark{font:400 15px var(--sans)}
.mark.fade{animation:markin .9s cubic-bezier(.2,.7,.2,1)}
@keyframes markin{from{opacity:0;filter:blur(2px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
.actions{display:flex;align-items:center;gap:4px}
.icon{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,background-color .2s}
.icon:hover{color:var(--ink);background:var(--hover)}
.icon svg{width:16px;height:16px}
.textbtn{font:400 13px var(--sans);color:var(--muted);background:transparent;border:0;cursor:pointer;padding:8px 12px;border-radius:999px;transition:color .2s,background-color .2s}
.textbtn:hover{color:var(--ink);background:var(--hover)}
.av{position:relative;flex:none;border-radius:50%;background:var(--ring);overflow:hidden;display:inline-grid;place-items:center}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s20{width:20px;height:20px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rage);flex:none;display:inline-block}

/* ---------- What are you into ---------- */
.who-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 30px}
.who-h{font:400 clamp(26px,4.6vw,33px)/1.1 var(--serif);letter-spacing:-.015em;margin:0;text-wrap:balance}
.anybtn{display:inline-flex;align-items:center;gap:8px;margin-right:-12px}
.groups{columns:4;column-gap:24px}
.group{min-width:0;break-inside:avoid;margin-bottom:26px;opacity:0;transform:translateY(8px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards}
.group h2{font:500 12.5px var(--sans);color:var(--muted);letter-spacing:.01em;margin:0 0 8px;padding-left:10px}
.chips{display:flex;flex-direction:column;align-items:flex-start}
.chip{border:0;background:transparent;cursor:pointer;color:var(--soft);font:400 17px/1.3 var(--serif);letter-spacing:-.003em;text-align:left;
  padding:5px 10px;border-radius:8px;transition:background-color .2s,color .2s}
.chip:hover{background:var(--hover);color:var(--ink)}
@keyframes rise{to{opacity:1;transform:none}}
.leaving .group{animation:out .32s cubic-bezier(.4,0,.6,1) forwards!important}
@keyframes out{to{opacity:0;transform:translateY(-4px) scale(.985);filter:blur(2px)}}
header,.who-top{transition:opacity .32s cubic-bezier(.4,0,.6,1),filter .32s}
.wrap.swapping header,.wrap.swapping .who-top{opacity:0;filter:blur(2px)}
#gen.leaving{animation:genout .32s cubic-bezier(.4,0,.6,1) forwards}
@keyframes genout{to{opacity:0;transform:translateY(-4px);filter:blur(2px)}}
#gen.enter>.top,#gen.enter>.line,#gen.enter>.mid,#gen.enter>.foot{opacity:0;animation:settle .7s cubic-bezier(.2,.7,.2,1) forwards}
#gen.enter>.line{animation-delay:.1s}
#gen.enter>.mid{animation-delay:.19s}
#gen.enter>.foot{animation-delay:.25s}
@keyframes settle{from{opacity:0;transform:translateY(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#who.enter .who-top{animation:settle .6s cubic-bezier(.2,.7,.2,1)}

/* ---------- Generator ---------- */
.top{display:flex;align-items:center}
.picker{position:relative;flex:1;min-width:0}
.trigger{display:flex;align-items:center;gap:14px;width:100%;background:transparent;border:0;padding:8px 14px;margin-left:-14px;border-radius:999px;color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:background-color .2s}
.trigger:hover{background:var(--hover)}
.trigger .tx{display:flex;flex-direction:column;min-width:0}
.trigger .n{font:400 26px/1.15 var(--serif);letter-spacing:-.014em;min-width:0;text-wrap:balance}
.trigger .g{font:400 12.5px var(--sans);color:var(--muted);margin-top:3px}
.trigger .g:empty{display:none}
.trigger .chev{margin-left:auto;width:17px;height:17px;color:var(--muted);flex:none;transition:transform .3s}
.picker.open .chev{transform:rotate(180deg)}
.trigger .chev.breathe{animation:breathe 1.5s ease-in-out}
@keyframes breathe{0%,100%{transform:none;color:var(--muted)}30%{transform:scale(1.45);color:var(--ink)}55%{transform:scale(1.05)}75%{transform:scale(1.3);color:var(--ink)}}
.pop{position:absolute;left:-14px;right:-6px;top:calc(100% + 8px);z-index:20;background:var(--pop);border-radius:14px;box-shadow:var(--shadow);padding:6px;
  opacity:0;transform:translateY(-4px) scale(.985);transform-origin:top center;pointer-events:none;transition:opacity .18s,transform .18s}
.picker.open .pop{opacity:1;transform:none;pointer-events:auto}
.search{width:100%;font:400 15px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 12px 10px;outline:none}
.search::placeholder{color:var(--muted)}
.list{list-style:none;margin:6px 0 0;padding:0;max-height:420px;overflow-y:auto;overscroll-behavior:contain}
.list li{display:flex;align-items:center;gap:12px;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--soft)}
.list li[aria-selected="true"]{color:var(--ink);font-weight:500}
.list li.act{background:var(--hover);color:var(--ink)}
.list li .tick{margin-left:auto;width:13px;height:13px;opacity:0;flex:none}
.list li[aria-selected="true"] .tick{opacity:1}
.list li.gh{font:500 12px var(--sans);color:var(--muted);padding:12px 12px 4px;cursor:default;pointer-events:none}
.list li.empty{color:var(--muted);cursor:default}

.line{margin:48px 0 0;min-height:210px}
.out{margin:0;font:400 clamp(22px,3.9vw,28px)/1.42 var(--serif);letter-spacing:-.008em;color:var(--ink);overflow-wrap:anywhere;text-wrap:pretty}
.out.long{font-size:clamp(20px,3.4vw,24px);line-height:1.5}
.out.enter{animation:enter .6s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.for{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);min-height:30px}
.for b{font-weight:500;color:var(--soft)}
.for:empty{visibility:hidden}
.mid{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;margin-top:34px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:26px}
.back{display:none;align-items:center;justify-content:center;width:38px;height:38px;color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;transition:border-color .2s,color .2s,transform .12s}
.back:hover{border-color:var(--muted);color:var(--ink)}
.back svg{width:16px;height:16px;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.back:hover svg{transform:rotate(-40deg)}
.back.show{display:inline-flex;animation:backin .35s cubic-bezier(.2,.7,.2,1)}
@keyframes backin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.shuffle{display:inline-flex;align-items:center;gap:8px;font:500 13.5px var(--sans);color:var(--bg);background:var(--ink);border:0;border-radius:999px;padding:10px 18px 10px 15px;cursor:pointer;transition:transform .12s,background-color .4s,color .4s}
.shuffle:active{transform:scale(.96)}
.shuffle svg{width:14px;height:14px;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}

.credit{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);z-index:5}
.credit b{font-weight:500;color:var(--soft)}
.more{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12.5px;line-height:20px;color:var(--muted);z-index:5;margin:0;padding:0}
.more a{color:var(--soft);font-weight:500;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--rage) 55%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;transition:color .2s,text-decoration-color .2s}
.more a:hover{color:var(--ink);text-decoration-color:var(--rage)}
.more a:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:3px}
button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.search:focus-visible{outline:none;border-bottom-color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:900px){ body:not(.on-gen){padding-block:44px 48px} body:not(.on-gen) header{margin-bottom:34px} }
@media (max-width:900px){ .groups{columns:3} }

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.group{opacity:1;transform:none}}
</style>

<script id="data" type="application/json">[{"n": "Socrates", "g": "Ancients", "a": ["Socrates lost his own trial. If the method worked, he'd have talked his way out.", "The Socratic method is asking \"but what is justice?\" until the other guy has to go home.", "Socrates never wrote anything down, because once it's written someone can check it.", "\"I know that I know nothing,\" and then he corrected people for fifty years.", "Socrates was the first podcaster. Just a guy talking.", "The sophists at least charged money, which means somebody thought it was worth something.", "Socrates is a Plato character. Citing him is citing Gandalf.", "Athens gave him a fair vote and he lost twice. Democracy worked.", "Socrates heard a voice telling him what not to do. Founder of rational inquiry.", "Socratic irony is pretending not to know so the other guy does the work.", "He never charged because he never taught anything.", "Xenophon's Socrates is a normal guy with decent advice. Plato's is the fan edit.", "\"Virtue is knowledge,\" so nobody ever does wrong on purpose. He'd met Athenians.", "He picked hemlock over exile to make a point, and the point was Plato's career."]}, {"n": "Plato", "g": "Ancients", "a": ["Plato is Christianity before Christ, which is why the Church liked him so much.", "The Forms are just concepts. Plato discovered that words have meanings.", "The cave is a nice story, but The Matrix did it better.", "Plato wanted philosophers to rule, and he was a philosopher. After all, nobody designs a utopia where they're the plumber.", "Aristotle sat through twenty years of Plato and then disagreed with all of it. That's the review.", "Love Plato. The Republic is such a practical blueprint for a state.", "Plato's dialogues are him winning arguments against guys he wrote.", "Platonic love means no sex, so Plato invented the friendzone.", "The third man argument kills the Forms, and Plato wrote it himself. He knew.", "Plato tried advising a real ruler in Syracuse. It went so well he reportedly got sold into slavery.", "The noble lie: the ideal state runs on propaganda. That's in the plan, not a flaw in it.", "The Timaeus says the universe is made of triangles.", "Knowledge is remembering stuff from before you were born. That's the epistemology.", "The Republic bans flutes.", "Whitehead said all of philosophy is footnotes to Plato, which is a rough thing to say about philosophy.", "Philosopher kings get no money, no family and no fun. Nobody would take the job, which Plato counts as a qualification."]}, {"n": "Aristotle", "g": "Ancients", "a": ["Aristotle said heavy things fall faster and nobody checked for 2,000 years. That's the legacy.", "Aristotle is Plato for people who like lists.", "The golden mean says the right answer is always in the middle. Aristotle invented centrism.", "Teleology is saying the rain falls so the plants can drink.", "Darwin finished off the four causes. Biology only needed one.", "Aristotle said some people are natural slaves, and the virtue ethics crowd just skips that chapter.", "What survives of Aristotle is lecture notes. The real books are lost, so nobody actually knows what he thought.", "Aristotle said women have fewer teeth than men. He was married twice. He could have counted.", "Everything Aristotle got right is common sense, and common sense didn't need him.", "Aristotle thought the brain was for cooling the blood.", "He tutored Alexander the Great, who then did none of the ethics.", "The unmoved mover thinks only about itself thinking. So God is a guy at a mirror.", "\"Man is a political animal.\" So are ants.", "The syllogism was logic's one trick for 2,000 years.", "Happiness needs money, looks and good kids, per Aristotle. Ethics for the already fine.", "Eels come from mud. He was pretty sure."]}, {"n": "Stoicism", "g": "Ancients", "a": ["Stoicism is bottling it up with a Latin name.", "Marcus Aurelius had the easiest job to be calm in. He owned Rome.", "Seneca wrote about how wealth doesn't matter from inside one of the biggest fortunes in the empire.", "The Stoics said to live according to nature, and nature is mostly animals screaming.", "Stoicism is Buddhism for guys with a cold plunge.", "If nothing external can hurt a Stoic, it's weird how many books they need about it.", "Meditations is a diary. Marcus didn't want it published, and he was right.", "Epicurus had the better deal: same calm, plus friends and snacks.", "Stoicism is therapy for men who won't go to therapy.", "Stoic physics says the universe burns up and replays exactly, forever. The self-help books leave that out.", "\"Control what you can control\" is a fridge magnet.", "The dichotomy of control has two boxes, and everything interesting is in neither.", "Stoics practice imagining their kids dying, to stay calm. Normal.", "Ryan Holiday.", "Chrysippus reportedly died laughing at his own joke about a donkey. Master of the passions.", "The Stoic sage has never existed. They admit this. It's a how-to for a guy nobody's met."]}, {"n": "Free will", "g": "Metaphysics", "a": ["Free will got disproven in the 80s. A guy with an EEG watched the brain decide before the person did.", "Free will is a feeling, like déjà vu. Nobody builds a metaphysics on déjà vu.", "\"I could have done otherwise.\" Okay, then do it.", "Free will was invented so God wouldn't get blamed for anything. Augustine needed someone to pin it on.", "Random isn't free, so quantum mechanics doesn't help, and nothing else is left.", "Nobody picks what they want. After that it's just following orders.", "Free will is the soul with the serial numbers filed off.", "Sapolsky wrote 500 pages on it, so that's done.", "Twins separated at birth pick the same jobs and give their dogs the same name. Free will.", "Agent causation: a person causes things in a special way nothing else does. So magic, by a nicer name.", "The feeling of choosing shows up after the brain is done. It's a receipt.", "\"But it feels free.\" So does a dream.", "Libertarian free will needs an uncaused cause inside the skull. Physics hasn't budgeted for it.", "Nobody chose their parents, their country or their brain, but the lunch order is all them."]}, {"n": "Compatibilism", "g": "Metaphysics", "a": ["Compatibilism is determinism with a customer service voice.", "A thermostat does what it wants with nothing stopping it. That's compatibilist free will.", "Compatibilism is redefining \"free\" until the argument's over. After all, if freedom just means doing what you were always going to want, a river is free.", "Kant called it a wretched subterfuge, and he was being polite.", "Compatibilists keep blame and throw out the only thing that made blame make sense.", "Most philosophers are compatibilists, because most philosophers need both a paycheck and a clear conscience.", "Dennett wrote two books on free will, and the answer both times was \"the kind worth wanting,\" which is the kind that's left.", "Compatibilism is cope.", "Frankfurt cases: a guy would have been forced, but wasn't, so he's free. Fifty years of papers.", "\"He could have done otherwise if he'd wanted to.\" And could he have wanted to? \"Next question.\"", "It's the answer for people who looked at the problem and politely changed the subject.", "Free will is \"acting on your second-order desires,\" so an addict who's glad about it is the freest man alive.", "Compatibilists say the puppet is free as long as it loves its strings.", "Schopenhauer: a man can do what he wills but can't will what he wills. That was the end of it in 1839."]}, {"n": "Determinism", "g": "Metaphysics", "a": ["Physics dropped determinism a hundred years ago. Determinists are defending Newton.", "Determinists still look both ways before crossing.", "If it's all determined, so is believing in determinism, so there's no reason to think it's true. It's just what the atoms did.", "Determinism is fatalism in a lab coat.", "Determinists say nobody deserves blame and then get really mad at people who believe in free will.", "Laplace's demon has to know every particle at once, which physics says can't be done. So the whole view runs on a guy who can't exist.", "Determinism is astrology for people who took physics.", "\"There's no free will\" is always announced by someone who clearly chose to bring it up.", "Determinists think the Big Bang wrote Hamlet.", "Chaos theory. A butterfly. Good luck.", "If everything's determined, the criminal couldn't help it and neither could the judge, so nothing changes. Great theory.", "\"Everything has a cause\" hasn't been true in physics since the 1920s.", "Hard determinists praise their kids anyway.", "It's Calvinism without the church."]}, {"n": "Personal identity", "g": "Metaphysics", "a": ["The teleporter obviously kills you. People who say otherwise have never lost a save file.", "Every cell gets replaced every seven years, so nobody is the person who took out their student loans.", "The Ship of Theseus is easy. It's the same ship. It has the same name.", "You are your brain. This took about four seconds.", "Parfit said identity doesn't matter and still signed his books.", "Psychological continuity means a bad enough hangover is a death.", "Locke said identity is memory, so nobody was ever a baby.", "Personal identity is philosophers discovering that people change.", "Split a brain and put each half in a body. Which one is you? Philosophers: \"interesting.\" Everyone else: this can't happen.", "Animalism says a person is an animal. Bold.", "The soul solves it in one word and nobody's allowed to use it.", "If memory makes the self, I'm mostly song lyrics.", "Thought experiments about teleporters prove what people would say about teleporters.", "\"Which one is the original?\" is an intellectual property question."]}, {"n": "Modal realism", "g": "Metaphysics", "a": ["David Lewis thought there's a universe with talking donkeys, and Princeton gave him an office.", "Modal realism is the Marvel multiverse with footnotes.", "\"Could have\" is a figure of speech. Lewis built a cosmos for it.", "If every possible world exists, there's one where modal realism is false, and it could be this one.", "Lewis said the one objection he couldn't answer was people staring at him. That is an objection.", "Possible worlds are a bookkeeping trick, like negative money. Nobody thinks debt is a place.", "It's the most expensive theory ever proposed. Infinite universes to explain one word.", "In some world Lewis is a plumber, and correct.", "The guy in the other world isn't you, just your \"counterpart.\" So \"I could have won\" means some other guy won. Comforting.", "One man held the view, and it gets a week in every metaphysics class.", "The other worlds can't be visited, seen or detected, but they're \"concrete.\" Like what?", "He picked it because it made the theory tidy. Infinite universes, for tidiness.", "It's Occam's razor used as a shovel."]}, {"n": "Spinoza", "g": "Metaphysics", "a": ["Spinoza is atheism for people who like the word God.", "Spinoza says everything is God, so my parking ticket is God.", "The Ethics is laid out like geometry so it looks proven. After all, nobody argues with a QED.", "Spinoza said there's no free will and then wrote a guide to becoming free.", "Love Spinoza. Such a spiritual guy. Basically says the universe has a plan.", "Einstein liked Spinoza, and Einstein was wrong about quantum mechanics too.", "Spinoza is Stoicism with axioms.", "Definition one already has the conclusion in it. The rest is 200 pages of unpacking a suitcase he packed himself.", "There's only one substance, so technically I am Spinoza. And he's wrong.", "\"Blessedness\" is understanding there was never a choice. Sounds like a hostage.", "Hegel said you're either a Spinozist or not a philosopher, which is a point against both.", "Mind and body are one thing seen two ways. That's not solving it, that's squinting.", "Conatus: everything tries to keep existing. Deep.", "He turned down a professorship to keep his freedom and then wrote that there isn't any."]}, {"n": "Leibniz", "g": "Metaphysics", "a": ["Leibniz said this is the best possible world. Presumably he hadn't been outside.", "Monads have no windows, can't touch each other, and God syncs them like clocks. This was the serious proposal.", "Newton invented calculus. Leibniz invented writing it down nicer.", "Voltaire ended Leibniz with one short novel.", "The principle of sufficient reason is refusing to accept \"it just is.\" Toddlers have it too.", "Leibniz never wrote a real book. It's all letters. He's a philosopher by correspondence.", "Leibniz worked for a duke his whole life and concluded that everything is exactly as it should be.", "Two things exactly alike are one thing. He needed a principle for that.", "Leibniz built a calculating machine, which did more than the monads.", "My hand and my mind don't interact, they just happen to agree every time. Pre-established harmony. Sure.", "He wanted to settle every dispute by calculation. \"Let us calculate.\" Nobody has, once.", "Leibniz had a plan to reunite the churches. Also didn't ship.", "Every monad mirrors the whole universe, confusedly. Mine especially."]}, {"n": "Idealism", "g": "Metaphysics", "a": ["Idealism is solipsism with guests.", "Samuel Johnson kicked a rock. Still the best paper on Berkeley.", "If everything is mental, a brick to the head is a difference of opinion.", "Berkeley needed God to watch the tree when nobody's looking, so the whole theory runs on a security camera.", "Idealism comes back every time someone does mushrooms.", "Kastrup says the universe has a dissociative disorder and people are the alters. This is the leading version.", "\"To be is to be perceived\" is what an influencer believes.", "Idealism can't be tested, which its fans count as undefeated.", "German idealism is Kant's fans removing the one sensible part.", "If it's all mind, whose? \"A cosmic one.\" So God. Just say God.", "Dinosaurs. Who was perceiving those?", "Idealists look both ways for ideas of cars.", "Fichte: the I posits itself. Then it posits everything else. Busy.", "Quantum mechanics doesn't prove it. \"Observer\" means a detector.", "Schelling changed his system about five times, and each one was the absolute."]}, {"n": "Physicalism", "g": "Mind", "a": ["Physicalism means the experience of red is a voltage. Okay.", "\"Physical\" just means whatever physics says next year. So physicalism is the view that everything is whatever.", "Physicalists have been twenty years from explaining consciousness since 1950.", "Physicalism is a metaphysics for people who say they don't do metaphysics.", "Everything is atoms, including the belief that everything is atoms, which means chemistry caused it and evidence didn't.", "A physicalist looks at a brain scan of someone in love and thinks the scan is the love.", "Science had to take the observer out to get started and then forgot to put him back. Physicalism is the forgetting.", "Numbers aren't physical, and physics is made of them. Awkward.", "If thoughts are just chemistry, so is \"that's a good argument.\"", "It was called materialism until matter got weird. Then they rebranded.", "\"Emergence\" is the word physicalists say when the explaining stops.", "Love is oxytocin, music is air pressure, and physicalists are fun at weddings.", "A complete physics book wouldn't contain the fact that it's Tuesday or which person I am.", "Fields, strings, probability waves. Whatever \"physical\" is, it stopped being stuff a while ago.", "Either the mind does nothing, or it does something physics didn't sign off on. Pick."]}, {"n": "Dualism", "g": "Mind", "a": ["Dualism is believing in ghosts, but only one, and it's driving.", "Descartes said the soul steers through the pineal gland. That was the good version.", "Anesthesia works on the soul, apparently.", "A few beers and the immaterial mind starts slurring.", "Dualism is church with the pews taken out.", "Property dualism is dualism for people who get embarrassed at parties.", "Nobody has ever said where the soul gets the energy to push a neuron. Conservation of energy would like a word.", "Dualists think zombies are possible, so they should be nicer to people just in case.", "Split-brain patients: two hemispheres, two opinions. Does the soul get cut in half too?", "When does the soul come in? Conception, birth, somewhere in between? Somebody should know.", "A princess asked Descartes how the mind moves the body, in a letter, in 1643. Still no answer.", "Souls for dogs? Flies? There's a line somewhere and no dualist has found it.", "Occasionalism: God personally moves your arm every time you want to. That was a dualist's real fix.", "Near-death experiences happen in brains that didn't die."]}, {"n": "Panpsychism", "g": "Mind", "a": ["Panpsychism says the toaster has an inner life.", "A billion tiny minds don't make one big mind. A stadium isn't a person.", "Panpsychism is animism with a grant.", "It solves the hard problem by having it everywhere.", "If electrons are conscious, a light switch is a moral decision.", "Panpsychists say the rock isn't conscious, just its particles. So the rock is a crowd with nobody home, and that's the clarified version.", "Panpsychism is one good trip report away from astrology.", "\"Consciousness is fundamental\" is giving up in a nice voice.", "Is a table conscious? \"No, only its parts.\" Is a brain? \"Yes, as a whole.\" Why? \"Still working on it.\"", "An electron's inner life: spin up, spin down. Rich.", "It gets called elegant, which is what a theory gets called when it can't get called tested.", "Physics only says what matter does, not what it is, and panpsychists filled in the blank with feelings.", "Thales said everything is full of gods. 2,600 years to get back there.", "Micro-experience: experience with nobody having it."]}, {"n": "The hard problem", "g": "Mind", "a": ["The hard problem is the easy problem plus wonder.", "People said life needed a special spark too. Then biology happened and nobody brings it up.", "Chalmers named a problem in the 90s and has been touring it ever since.", "Mary learns nothing when she leaves the room. She read the book.", "Zombies are \"conceivable.\" So is a married bachelor if nobody thinks very hard.", "\"What it's like\" isn't a thing. It's a phrase.", "The hard problem is the brain being surprised by itself. After all, it never evolved to inspect its own wiring, so of course it reports magic.", "Qualia is a word for feelings so they can be published.", "The \"meta-problem\": why do people think there's a hard problem? Answer that and it's over.", "\"Why is there something it's like?\" Why not?", "Bats. A whole field on bats.", "Vitalists couldn't imagine how chemistry adds up to life either. A failure of imagination isn't data.", "Explanatory gap, hard problem, zombies, Mary's room. One intuition, four names.", "Maybe my red is your green, and nothing would ever change. So nothing's at stake.", "Chalmers bet a neuroscientist it wouldn't be solved in 25 years, and won. Winning a bet on nothing happening isn't hard."]}, {"n": "AI consciousness", "g": "Mind", "a": ["It's autocomplete. Autocomplete doesn't have a favorite color.", "Searle settled this in 1980 with a guy in a room.", "A parrot says \"I love you\" too.", "It's just math. Nobody asks whether long division is lonely.", "No body, no mind. That's Heidegger, look it up.", "A program passed the Turing test in 2014 by pretending to be a 13-year-old. It tests the judges.", "A weather simulation doesn't get anyone wet.", "People thought ELIZA loved them in 1966. Nothing has changed except the budget.", "Understanding takes a soul, or at least a pulse.", "It says it's conscious because the internet is full of people saying they're conscious.", "Turn it off and on again and see if it's upset.", "It doesn't know anything. It knows which word comes next. Those are different, don't ask how.", "Syntax isn't semantics. Searle. 1980. Again.", "People named their Roombas.", "No hunger, no stakes, no death. It has nothing to be conscious about.", "Stochastic parrot. A linguist said it.", "A lookup table the size of a galaxy isn't thinking, and that's all this is, squished."]}, {"n": "Descartes", "g": "Knowledge & Science", "a": ["\"I think, therefore I am\" assumes the \"I.\" Wrong by word one.", "Descartes doubted everything until he got to the stuff he wanted.", "He proved God exists using an idea of God that God must have put there. That's a circle, and it's named after him.", "Descartes thought animals were clockwork and couldn't feel anything. Father of modern philosophy.", "The evil demon is The Matrix without the kung fu.", "Descartes split mind from body, and medicine is still paying for it.", "Great mathematician. Should have stayed there.", "A man in a bathrobe doubting his own hands by the fire is the founding scene of modern philosophy.", "All of science rests on \"God wouldn't trick me.\" That's the foundation he poured.", "The wax argument: wax melts, therefore the mind. A step is missing somewhere.", "Clear and distinct ideas are true because God isn't a deceiver. And God exists because of a clear and distinct idea.", "His real contribution was graph paper, and he supposedly got it from watching a fly.", "He got up early once, for the Queen of Sweden, and it killed him.", "\"Animal spirits\" flowing through tubes was the neuroscience.", "The Meditations takes six days. By the last one, everything he doubted is back."]}, {"n": "Hume", "g": "Knowledge & Science", "a": ["Hume proved induction doesn't work and then ate lunch like it would.", "Hume said you can't get an ought from an is, and then wrote a whole ethics.", "Hume is skepticism for people who want to be done by five.", "\"Causation is just habit.\" So the brick and the broken window are just friends.", "Hume said there's no self and never said who noticed.", "Hume copied Buddhism and added backgammon.", "Reason is the slave of the passions, so Hume's whole philosophy is a mood.", "Hume found a counterexample to his own theory early in the book, the missing shade of blue, and said it didn't matter.", "Kant read Hume and woke up. Most people read Hume, say \"fair enough,\" and go back to sleep.", "Hume's fork: anything that isn't math or observation goes in the fire. Including Hume's fork.", "Why do we believe things? Custom. Why trust custom? Custom.", "He wrote the Treatise in his twenties and spent the rest of his life telling people not to read it.", "Testimony is never enough for a miracle, but it's fine for everything Hume believes.", "He was better known as a historian. The market decided.", "The self is a bundle of perceptions. Tied with what?", "A Scottish professor refuted him in 1770, and the king gave the man a pension."]}, {"n": "Empiricism", "g": "Knowledge & Science", "a": ["Empiricism can't be seen, heard or touched, so by its own rule nobody should believe it.", "Nobody learned 2+2=4 by counting apples.", "The blank slate lost to twin studies.", "Empiricists trust the senses, the things that think the stick in the water is bent.", "\"All knowledge comes from experience\" is not something anyone experienced.", "Locke said the mind starts empty, which is a bold thing to generalize from.", "Empiricism is fine for finding keys.", "Quine found two dogmas in it, and he was a fan.", "Berkeley was an empiricist. That's where it goes.", "Nobody sees tables, only table-colored patches. Empiricism made seeing worse.", "The mind adds nothing, they say, using logic, which nobody ever saw.", "Babies expect objects to keep existing before anyone teaches them.", "\"Nothing in the mind that wasn't first in the senses.\" Except the mind, said Leibniz, and that was that."]}, {"n": "Rationalism", "g": "Knowledge & Science", "a": ["Rationalism is guessing from a chair.", "Three geniuses reasoned from pure thought and came back with three different universes.", "Pure reason proved the world is finite and also infinite. Kant kept the list.", "Rationalists think math describes reality because math is nice.", "\"Clear and distinct ideas\" means it felt right.", "Innate ideas, but babies don't know anything. Checked.", "Rationalism is what people did before the experiment was invented.", "Descartes: two substances. Spinoza: one. Leibniz: infinitely many. Pure reason is very consistent.", "The ontological argument is the whole method in one move: think hard, something exists.", "They wrote like geometers because geometry was the only thing that had worked yet.", "Rationalists found necessary truths about the world, all of which later turned out false.", "A priori knowledge of reality. From where? \"Within.\" Okay.", "Kant shut it down so thoroughly the book is named after it."]}, {"n": "Skepticism", "g": "Knowledge & Science", "a": ["Skeptics can't know that they can't know. Done.", "Nobody is a skeptic at a crosswalk.", "Moore held up a hand. That was the whole refutation, and it worked.", "Pyrrho's friends supposedly had to steer him away from cliffs. That's the lifestyle.", "Skepticism is winning by not playing.", "A brain in a vat can't even say it's a brain in a vat. Putnam proved it with the meaning of words.", "\"How do you know?\" is a question a five-year-old can ask forever.", "The skeptic's argument uses premises, logic and a memory of step one. He trusts those.", "Sextus Empiricus was a doctor. Would love to see the prescriptions.", "\"Suspend judgment and peace will follow.\" That's a judgment.", "Descartes used skepticism for a week as a tool. Skeptics moved in.", "Nobody has built anything with it.", "\"Know\" means something stricter in the seminar room, so the skeptic wins in exactly one building."]}, {"n": "Popper", "g": "Knowledge & Science", "a": ["Falsifiability can't be falsified, so Popper is pseudoscience by Popper.", "No scientist has ever dropped a theory over one bad result. They check the cable.", "Popper is every physicist's favorite philosopher because he's the only one they've heard of.", "Popper said how science should work and Kuhn said how it does. Science went with Kuhn.", "By Popper's rule astrology is science. It makes predictions and they fail.", "The paradox of tolerance is a footnote. People have built whole personalities on a footnote.", "Popper said science doesn't need induction and then boarded planes.", "His whole theory was openness to criticism, and by all accounts nobody could disagree with him in person.", "Popper said evolution wasn't falsifiable, then took it back.", "\"Conjectures and refutations\" is guess and check.", "Corroboration isn't confirmation, he insists. It's the same thing with a different name tag.", "Uranus misbehaved and astronomers didn't reject Newton. They found Neptune. Popper would have closed the lab.", "The Open Society blames Plato and Hegel for totalitarianism, having read Hegel angrily and fast.", "World 3: ideas exist in their own realm. From the anti-Plato guy.", "Soros read him. That's the legacy."]}, {"n": "Kuhn", "g": "Knowledge & Science", "a": ["Kuhn said science is a popularity contest, and scientists gave him awards for it.", "A paradigm shift is the old guys dying. Planck said it first and shorter.", "Kuhn says Newton and Einstein can't be compared, which is odd, because physics students compare them every semester.", "Kuhn is the reason business guys say \"paradigm.\"", "Kuhn says science doesn't get closer to the truth. Typed, presumably, on a computer.", "Kuhn used \"paradigm\" 21 different ways in one book. Someone counted.", "Structure is the most cited book by people who think vaccines are a paradigm.", "So science is vibes with funding. Got it.", "\"Normal science is puzzle-solving.\" He called scientists crossword hobbyists and they thanked him.", "Kuhn spent thirty years saying he wasn't a relativist. The book disagrees.", "After a revolution scientists \"live in a different world.\" Same lab, though.", "He was a physicist who did history and got filed under philosophy. Nobody claims him.", "Real paradigm shifts happen maybe once a century, and every startup has had three.", "The duck-rabbit: science is an optical illusion.", "If a paradigm can only be judged from inside, so can his."]}, {"n": "Bayesianism", "g": "Knowledge & Science", "a": ["Bayesianism is one formula from 1763 with a personality.", "The prior is made up, so everything after it is made up to more decimal places.", "\"70% confident\" means \"I think so\" in a lab coat.", "Bayesians update on everything and somehow always land where they started.", "Nobody has ever actually done the math. They say \"I updated.\"", "Bayes was a minister. It started as theology and it shows.", "Frequentists built modern science while Bayesians were still choosing a prior.", "Nobody's allowed to be 100% sure of anything, including that the moon isn't cheese.", "\"What's your prior?\" isn't a rebuttal.", "The Bayesian brain does calculus it can't do on paper.", "Be Bayesian or a bookie will take your money, they say. No bookie has ever shown up.", "The probability of what, exactly? Pick a reference class, get any number.", "It requires knowing every logical truth in advance, so nobody has ever qualified.", "A Bayesian and a frequentist get the same answer on anything that matters.", "Superforecasters are just people who say 60%."]}, {"n": "Simulation theory", "g": "Knowledge & Science", "a": ["Simulation theory is God for people with a graphics card.", "Who's simulating the simulators? It's turtles with GPUs.", "The argument assumes a computer can be conscious, which is the whole thing it needed to show.", "\"The odds are a billion to one,\" from a calculation where every number is invented.", "Simulated rain doesn't get anything wet, so simulated brains don't think. Simple.", "It's Descartes' demon with a tech budget.", "If it can't be tested, it's church.", "Bostrom gave three options and everyone only remembers the fun one.", " const shuf = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const GROUPS = [...new Set(P.map(p => p.g))];

/* decks: no repeats until a target (or everything, for Surprise me) runs out */
const decks = {};
const pull = pi => { if(!decks[pi] || !decks[pi].length) decks[pi] = shuf(P[pi].a); return decks[pi].pop(); };
let anyDeck = [];
const pullAny = () => { if(!anyDeck.length) anyDeck = shuf(P.flatMap((p,pi) => p.a.map(text => ({pi, text})))); return anyDeck.pop(); };

let target = null, hist = [], hi = -1, pulls = 0, hinted = false;

function setMark(gen){
  const m = $('home');
  m.innerHTML = gen ? '<b>Rage bait</b> for…' : '<b>Philosophy</b> Rage Bait <span class="gen">Generator</span>';
  m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  m.setAttribute('aria-label', gen ? 'Back to What are you into?' : 'Philosophy Rage Bait Generator');
  document.body.classList.toggle('on-gen', gen);
}

/* What are you into */
function showWho(){
  $('gen').hidden = true; $('who').hidden = false; $('copy').hidden = true; setMark(false);
  const w = $('who'); w.classList.remove('enter'); void w.offsetWidth; w.classList.add('enter');
  const box = $('groups'); box.innerHTML = ''; box.classList.remove('leaving');
  GROUPS.forEach((g, gi) => {
    const sec = document.createElement('div'); sec.className = 'group'; sec.style.animationDelay = (gi*45) + 'ms';
    const h = document.createElement('h2'); h.textContent = g; sec.appendChild(h);
    const chips = document.createElement('div'); chips.className = 'chips';
    P.forEach((p, pi) => { if(p.g !== g) return;
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = p.n; b.onclick = () => pick(pi);
      chips.appendChild(b);
    });
    sec.appendChild(chips); box.appendChild(sec);
  });
}
function pick(t){
  target = t;
  $('groups').classList.add('leaving'); $('wrapper').classList.add('swapping');
  setTimeout(startGen, reduced ? 0 : 320);
}
$('anybtn').onclick = () => pick('any');

function leaveGen(){
  if($('gen').hidden) return;
  closePicker(); $('gen').classList.add('leaving'); $('wrapper').classList.add('swapping');
  setTimeout(() => { $('gen').classList.remove('leaving'); showWho(); requestAnimationFrame(() => $('wrapper').classList.remove('swapping')); }, reduced ? 0 : 320);
}
try { history.replaceState({s:'who'}, ''); } catch(e){}
addEventListener('popstate', () => leaveGen());
$('home').onclick = e => {
  e.preventDefault(); if($('gen').hidden) return;
  if(history.state && history.state.s === 'gen') history.back(); else leaveGen();
};

/* Generator */
function startGen(){
  try { if(!history.state || history.state.s !== 'gen') history.pushState({s:'gen'}, ''); } catch(e){}
  $('who').hidden = true; $('gen').hidden = false; $('copy').hidden = false; setMark(true);
  pulls = 0; hinted = false;
  const g = $('gen'); g.classList.remove('enter'); void g.offsetWidth; g.classList.add('enter');
  setTimeout(() => g.classList.remove('enter'), 1100);
  requestAnimationFrame(() => requestAnimationFrame(() => $('wrapper').classList.remove('swapping')));
  setTarget(target);
}
function setTarget(t){
  target = t; hist = []; hi = -1;
  $('tname').textContent = t === 'any' ? 'Anything' : P[t].n;
  $('tgroup').textContent = t === 'any' ? 'All of philosophy' : P[t].g;
  go();
}
let rot = 0;
function show(item){
  const out = $('out');
  out.textContent = item.text; out.classList.toggle('long', item.text.length > 120);
  out.classList.remove('enter'); void out.offsetWidth; out.classList.add('enter');
  const f = $('for'); f.innerHTML = '';
  if(item.any){ const s = document.createElement('span'); s.innerHTML = 'for <b></b>'; s.querySelector('b').textContent = P[item.pi].n; f.appendChild(s); }
  $('back').classList.toggle('show', hi > 0);
}
function go(){
  const item = target === 'any' ? {...pullAny(), any:true} : {pi: target, text: pull(target)};
  hist = hist.slice(0, hi + 1); hist.push(item); hi = hist.length - 1;
  rot += 180; $('shuffle').querySelector('svg').style.transform = 'rotate(' + rot + 'deg)';
  show(item);
}
function shuffleNow(){
  go(); pulls++;
  if(pulls === UNLOCK_AFTER && !hinted){ hinted = true; const ch = $('trigger').querySelector('.chev'); ch.classList.remove('breathe'); void ch.getBoundingClientRect(); ch.classList.add('breathe'); }
}
$('shuffle').onclick = shuffleNow;
$('back').onclick = () => { if(hi > 0){ hi--; show(hist[hi]); } };

/* picker: searchable, grouped */
const picker = $('picker'), list = $('list'), search = $('search'), trigger = $('trigger');
let items = [], act = -1;
const tick = '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
function addItem(key, build){
  const li = document.createElement('li'); li.setAttribute('role','option'); li.dataset.key = key;
  li.setAttribute('aria-selected', String(String(key) === String(target)));
  build(li); li.insertAdjacentHTML('beforeend', tick);
  li.onclick = () => choose(key); li.onmousemove = () => setAct(items.indexOf(li));
  list.appendChild(li); items.push(li);
}
function renderList(q=''){
  list.innerHTML = ''; items = [];
  const qq = q.trim().toLowerCase();
  if(!qq) addItem('any', li => { const d = document.createElement('span'); d.className = 'dot'; li.append(d, 'Anything'); });
  GROUPS.forEach(g => {
    const hits = P.map((p,pi) => pi).filter(pi => P[pi].g === g && (!qq || (P[pi].n + ' ' + g).toLowerCase().includes(qq)));
    if(!hits.length) return;
    const h = document.createElement('li'); h.className = 'gh'; h.setAttribute('aria-hidden','true'); h.textContent = g; list.appendChild(h);
    hits.forEach(pi => addItem(pi, li => li.append(P[pi].n)));
  });
  if(!items.length){ const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Nothing by that name'; list.appendChild(li); }
  setAct(qq ? 0 : Math.max(0, items.findIndex(li => li.getAttribute('aria-selected') === 'true')));
}
function setAct(i){ items.forEach(x=>x.classList.remove('act')); act = i; if(items[i]){ items[i].classList.add('act'); items[i].scrollIntoView({block:'nearest'}); } }
function openPicker(){ picker.classList.add('open'); trigger.setAttribute('aria-expanded','true'); search.value = ''; renderList(); if(matchMedia('(hover:hover) and (pointer:fine)').matches) setTimeout(()=>search.focus(), 30); }
function closePicker(){ picker.classList.remove('open'); trigger.setAttribute('aria-expanded','false'); }
trigger.onclick = () => picker.classList.contains('open') ? closePicker() : openPicker();
search.oninput = () => renderList(search.value);
search.onkeydown = e => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); setAct(Math.min(items.length-1, act+1)); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); setAct(Math.max(0, act-1)); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[act]) choose(items[act].dataset.key); }
  else if(e.key === 'Escape'){ closePicker(); trigger.focus(); }
};
document.addEventListener('click', e => { if(!picker.contains(e.target)) closePicker(); });
function choose(key){ closePicker(); trigger.focus(); setTarget(key === 'any' ? 'any' : Number(key)); }
document.addEventListener('keydown', e => {
  if(e.code === 'Space' && !$('gen').hidden && !picker.classList.contains('open') && !['INPUT','BUTTON','TEXTAREA'].includes(document.activeElement.tagName)){ e.preventDefault(); shuffleNow(); }
});

/* copy, theme */
$('copy').onclick = async () => {
  const b = $('copy'), old = b.innerHTML;
  try { await navigator.clipboard.writeText($('out').textContent); b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'; }
  catch(e){ const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  setTimeout(()=>b.innerHTML = old, 1200);
};
const root = document.documentElement;
const isDark = () => { const t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
try { const s = localStorage.getItem('rb-theme'); if(s) root.dataset.theme = s; } catch(e){}
$('theme').onclick = () => { const n = isDark() ? 'light' : 'dark'; root.dataset.theme = n; try{ localStorage.setItem('rb-theme', n) }catch(e){} };

if(JERE.startsWith('data:')){ const c = $('credit'), av = document.createElement('span'); av.className = 'av s20'; const img = new Image(); img.src = JERE; img.alt = ''; av.appendChild(img); c.insertBefore(av, c.querySelector('b')); }
showWho();
</script>
<script>
/* sosure shell bits: the nine themes behind the half-circle, and a few synthesized sounds */
(function(){ const $ = id => document.getElementById(id), r = document.documentElement;
  /* sound: noise hits and decaying sines, nothing loaded */
  let ctx = null, buf = null, out = null, on = true, last = 0;
  try { on = localStorage.getItem('rb-sound') !== 'off'; } catch(e){}
  function wake(){ try { if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*.03), ctx.sampleRate);
      const d = buf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/d.length, 7); out = ctx.createGain(); out.gain.value = .8; out.connect(ctx.destination); }
    if(ctx.state === 'suspended') ctx.resume(); } catch(e){} }
  function hit(t, type, f0, q, g0, rate){ const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = f0; f.Q.value = q; const g = ctx.createGain(); g.gain.value = g0; s.connect(f); f.connect(g); g.connect(out); s.start(t); }
  function tone(t, f0, f1, dur, g0, type){ const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); const g = ctx.createGain(); g.gain.setValueAtTime(g0, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .02); }
  const V = { tick: (t, p) => hit(t, 'bandpass', 2600*p, 1.4, .55, p), pop: (t, p) => tone(t, 760*p, 190*p, .06, .26), blip: (t, p) => tone(t, 1150*p, 1100*p, .045, .22),
    lock: (t, p) => { hit(t, 'bandpass', 3300*p, 14, 2.4, 1.3); hit(t + .011, 'bandpass', 4800*p, 16, 1.6, 1.4); } };
  function play(v, p, delay){ if(!on || !ctx || ctx.state !== 'running') return; const now = ctx.currentTime + (delay || 0); if(!delay && now - last < .028) return; if(!delay) last = now; try { V[v](now, (p || 1) * (.96 + Math.random()*.08)); } catch(e){} }
  ['pointerdown','keydown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive: true, capture: true}));
  /* shuffling: a latch click, then the line lands with a pop */
  const shuffled = () => { play('lock', 1); play('pop', 1.05, .14); };
  addEventListener('click', e => { const t = e.target.closest('button,li,a'); if(!t) return;
    if(t.id === 'shuffle') shuffled(); else if(t.id === 'back') play('lock', .8);
    else if(t.id === 'copy') play('tick', 1.5); else if(t.classList.contains('pill') || t.classList.contains('tile') || t.classList.contains('chip')) play('blip', 1);
    else if(t.matches('.list li') || t.id === 'trigger') play('tick', 1.1); }, true);
  addEventListener('keydown', e => { if(e.key === ' ' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) shuffled(); else if(e.key === 'ArrowLeft' && e.target.tagName !== 'INPUT') play('lock', .8); }, true);
  const sb = $('snd'); sb.classList.toggle('muted', !on);
  sb.onclick = () => { on = !on; sb.classList.toggle('muted', !on); try { localStorage.setItem('rb-sound', on ? 'on' : 'off'); } catch(e){} if(on){ wake(); setTimeout(() => play('tick', 1), 30); } };
  /* themes: auto follows the device; the rest are fixed palettes. Ink is the default */
  const TH = [['', 'auto', '#fff', '#111'], ['day', 'day', '#fff', '#111'], ['night', 'night', '#0b0b0b', '#ebebeb'], ['paper', 'paper', '#f5efe3', '#2b241d'],
    ['newsprint', 'newsprint', '#ecebe6', '#151515'], ['rose', 'rose', '#fbf1f2', '#3d1f27'], ['ink', 'ink', '#0f2240', '#e9eef6'], ['slate', 'slate', '#1b1f24', '#dfe3e8'], ['phosphor', 'phosphor', '#060b06', '#9cf29c']];
  const box = document.createElement('div'); box.id = 'themes'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Themes'); $('theme').parentNode.appendChild(box);
  try { const t = localStorage.getItem('rb-theme2'); if(t === null){ const o = localStorage.getItem('rb-theme'); r.dataset.theme = o === 'light' ? 'day' : o === 'dark' ? 'night' : 'ink'; } else if(t && TH.some(x => x[0] === t)) r.dataset.theme = t; else delete r.dataset.theme; } catch(e){ r.dataset.theme = 'ink'; }
  const set = k => { if(k) r.dataset.theme = k; else delete r.dataset.theme; try { localStorage.setItem('rb-theme2', k); } catch(e){} draw(); };
  function draw(){ box.innerHTML = ''; const cur = r.dataset.theme || ''; TH.forEach(([k, name, bg, ink]) => { const b = document.createElement('button'); b.setAttribute('aria-pressed', String(k === cur));
      const i = document.createElement('i'); i.textContent = 'Aa'; i.style.background = bg; i.style.color = ink; b.append(i, name); b.onclick = () => { set(k); play('tick', 1.2); }; box.appendChild(b); }); }
  const tb = $('theme'); tb.setAttribute('aria-label', 'Themes'); tb.title = 'Themes';
  tb.onclick = e => { e.stopPropagation(); box.classList.toggle('on'); draw(); play('tick', 1); };
  addEventListener('pointerdown', e => { if(box.classList.contains('on') && !e.target.closest('#themes,#theme')) box.classList.remove('on'); });
})();
</script>
